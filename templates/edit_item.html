<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-warning">
                <div class="card-body">
                    <h4 class="card-title text-warning mb-4">✏️ Edit Furniture Item</h4>
                    
                    <form action="/update_item/{{ item.item_id }}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control" value="{{ item.category }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price (LKR)</label>
                            <input type="number" step="0.01" name="price" class="form-control" value="{{ item.price }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock Level</label>
                            <input type="number" name="stock_level" class="form-control" value="{{ item.stock_level }}" required>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="/inventory" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning">Update Item</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
