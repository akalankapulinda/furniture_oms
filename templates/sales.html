<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture OMS - Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <a href="/" class="btn btn-outline-secondary mb-3">🏠 Home</a>
    
    <h2 class="mb-4 text-center">🛒 Customer Sales (Outbound)</h2>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-success">
                <div class="card-body">
                    <h5 class="card-title text-success">Process New Sale</h5>
                    <form action="/add_sale_form" method="post">
                        
                        <div class="mb-3">
                            <label class="form-label">Customer Name</label>
                            <input type="text" name="customer_name" class="form-control" placeholder="e.g., Kamal Perera" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Select Furniture Item</label>
                            <select name="item_id" class="form-select" required>
                                <option value="" disabled {% if not selected_item_id %}selected{% endif %}>Choose an Item...</option>
                                {% for item in items %}
                                    <option value="{{ item.item_id }}" {% if item.item_id == selected_item_id %}selected{% endif %}>
                                        {{ item.name }} (Available: {{ item.stock_level }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity Sold</label>
                            <input type="number" name="quantity" class="form-control" min="1" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Complete Sale & Deduct Stock</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title mb-0">Recent Sales</h5>
                        <form action="/sales" method="get" class="d-flex">
                            <input type="text" name="search" class="form-control me-2" placeholder="Search customer, item, or date..." value="{{ search or '' }}">
                            <button type="submit" class="btn btn-outline-dark">Search</button>
                            <a href="/sales" class="btn btn-outline-danger ms-2">Clear</a>
                        </form>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Sale #</th>
                                    <th>Customer</th>
                                    <th>Item Sold</th>
                                    <th>Qty</th>
                                    <th>Date/Time</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for sale in sales %}
                                <tr>
                                    <td>{{ sale.sale_id }}</td>
                                    <td>{{ sale.customer_name }}</td>
                                    <td>{{ sale.item_name }}</td>
                                    <td><strong class="text-danger">-{{ sale.quantity }}</strong></td>
                                    <td><small class="text-muted">{{ sale.sale_date }}</small></td>
                                    <td>
                                        <a href="/delete_sale/{{ sale.sale_id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this Sale? This will ADD the item back to your stock.');">Delete</a>
                                    </td>
                                </tr>
                                {% else %}
                                <tr><td colspan="6" class="text-center">No sales found.</td></tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
